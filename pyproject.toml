[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "from-qom-to-new-york"
version = "1.0.0"
description = "UrbanPulse Dynamics Technical Case Study - Qom Metro Transit Optimization Platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "UrbanPulse Dynamics Engineering" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.scripts]
from-qom-to-new-york = "from_qom_to_new_york.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests",
]
pythonpath = [
    "src",
]
